services:
  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATA_DIR: /app/data
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      COOKIE_SECURE: "true"
      DEMO_MODE: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-12}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
    volumes:
      - classroom-data:/app/data
    expose:
      - "3001"
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  classroom-data:
  caddy-data:
  caddy-config:
