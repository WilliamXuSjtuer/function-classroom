<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>函数章节 · 互动学习系统</title>
<style>
  /* ================= 基础与共用样式 ================= */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f7; color: #1f2937; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  
  .topbar { display: flex; align-items: center; gap: 12px; padding: 11px 18px; background: #fff; border-bottom: 1px solid #e5eaf1; z-index: 10; }
  .topbar h1 { font-size: 15.5px; margin: 0; color: #0f172a; }
  .topbar .sub { font-size: 12.5px; color: #64748b; }
  .topbar .spacer { flex: 1; }
  .conn-badge { font-size: 11.5px; color: #10b981; background: #ecfdf5; padding: 4px 10px; border-radius: 999px; border: 1px solid #d1fae5; }
  .logout-btn { font-size: 12px; color: #ef4444; cursor: pointer; text-decoration: underline; margin-left: 12px; }

  .panel { background: #fff; border-radius: 14px; padding: 14px; overflow-y: auto; font-size: 13px; box-shadow: 0 2px 10px rgba(15,23,42,.06); border: 1px solid #e5eaf1; }
  .panel h2 { font-size: 13.5px; margin: 0 0 12px; color: #0f172a; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .chatwrap { background: #fff; border-radius: 14px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 2px 10px rgba(15,23,42,.06); border: 1px solid #e5eaf1; }
  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px 8px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
  .chat::-webkit-scrollbar, .panel::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb, .panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
  
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.student { flex-direction: row-reverse; }
  .avatar { font-size: 19px; line-height: 1.25; flex: none; width: 28px; text-align: center; }
  .bubble { max-width: 76%; padding: 11px 15px; border-radius: 15px; line-height: 1.72; font-size: 14.2px; white-space: pre-wrap; word-break: break-word; animation: pop .2s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.ai .bubble { background: #f1f5f9; border-top-left-radius: 5px; }
  .msg.student .bubble { background: #2563eb; color: #fff; border-top-right-radius: 5px; }
  .msg.teacher .bubble { background: #fef3c7; color: #78350f; border-top-left-radius: 5px; border-left: 3px solid #f59e0b; }

  .prog-item { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-bottom: 1px dashed #eef2f7; font-size: 12.2px; color: #334155; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; display: inline-block; }
  .dot.untouched { background: #cbd5e1; } .dot.ongoing { background: #f59e0b; } .dot.cleared { background: #10b981; } .dot.stuck { background: #ef4444; }
  .legend { font-size: 11px; color: #94a3b8; line-height: 2; margin-top: 10px; }

  /* ================= 登录页样式 ================= */
  #view-login { flex: 1; display: flex; align-items: center; justify-content: center; background: #eef2f7; }
  .login-box { background: #fff; padding: 40px; border-radius: 20px; width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(15,23,42,.1); }
  .login-box h1 { margin: 0 0 10px; font-size: 24px; color: #1e293b; }
  .login-box p { color: #64748b; font-size: 13px; margin-bottom: 25px; line-height: 1.6; }
  .login-box input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 20px; font-size: 15px; text-align: center; outline: none; transition: .2s; }
  .login-box input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .login-box button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 600; transition: .2s; }
  .login-box button:hover { background: #1d4ed8; }

  /* ================= 学生端专属 ================= */
  #view-student { flex: 1; display: none; flex-direction: column; height: 100%; }
  #view-student .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 226px; gap: 12px; padding: 12px; }
  
  .quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 22px 9px; min-height: 30px; }
  .chip { border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; border-radius: 999px; padding: 5px 13px; font-size: 12.5px; cursor: pointer; transition: .15s; }
  .chip:hover { background: #e2e8f0; border-color: #94a3b8; }

  .mathtools { padding: 10px 22px; display: flex; flex-direction: column; gap: 5px; border-top: 1px dashed #eef2f7; background: #fbfcfe; }
  .math-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .math-label { font-size: 11px; color: #64748b; font-weight: 600; width: 32px; flex: none; }
  .math-btn { border: 1px solid #dbe3ec; background: #fff; color: #1e293b; border-radius: 6px; min-width: 26px; height: 26px; padding: 0 6px; font-size: 13px; line-height: 1; cursor: pointer; transition: .1s; box-shadow: 0 1px 2px rgba(0,0,0,.02); }
  .math-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
  .math-btn:active { transform: scale(.95); background: #e2e8f0; }
  .autoconv { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #64748b; cursor: pointer; margin-top: 2px; }

  .composer { display: flex; gap: 8px; padding: 10px 22px 16px; background: #fbfcfe; }
  .composer textarea { flex: 1; height: 62px; resize: none; border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px 13px; font-family: inherit; font-size: 14px; outline: none; background: #fff; transition: .15s; }
  .composer textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
  .composer button { border: none; background: #2563eb; color: #fff; border-radius: 12px; padding: 0 22px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .composer button:hover { background: #1d4ed8; }

  /* ================= 教师端专属 ================= */
  #view-teacher { flex: 1; display: none; flex-direction: column; height: 100%; }
  #view-teacher .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr) 280px; gap: 12px; padding: 12px; }
  
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: #64748b; margin-bottom: 6px; font-weight: 600; }
  .field select, .field input[type="text"], .field input[type="number"] { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 9px 10px; font-size: 13px; outline: none; background: #fbfcfe; transition: .15s; }
  .field select:focus, .field input:focus { border-color: #2563eb; background: #fff; }
  .hint { font-size: 11px; color: #94a3b8; line-height: 1.6; margin-top: 4px; }
  
  .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .btn { border: 1px solid #cbd5e1; background: #fff; color: #334155; border-radius: 8px; padding: 8px 14px; font-size: 12.5px; cursor: pointer; transition: .15s; flex: 1; text-align: center; }
  .btn:hover { background: #f1f5f9; border-color: #94a3b8; }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.warn { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
  .btn.warn:hover { background: #fee2e2; border-color: #fca5a5; }

  .state-box { font-size: 12.5px; color: #475569; line-height: 2; background: #f8fafc; border-radius: 8px; padding: 12px; border: 1px solid #eef2f7; margin-bottom: 16px; }
  .state-box b { color: #1e293b; font-weight: 600; }
  
  .teacher-send { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px dashed #eef2f7; background: #fbfcfe; }
  .teacher-send textarea { flex: 1; height: 52px; resize: none; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 13px; outline: none; background: #fff; transition: .15s; }
  .teacher-send textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
  .teacher-send button { border: none; background: #2563eb; color: #fff; border-radius: 10px; padding: 0 20px; font-size: 13.5px; cursor: pointer; font-weight: 600; }
  .teacher-send button:hover { background: #1d4ed8; }
</style>
</head>
<body>

<!-- ================= 1. 登录视图 ================= -->
<div id="view-login">
  <div class="login-box">
    <h1>📐 函数章节 · 学习系统</h1>
    <p>请输入您的身份：<br>学生请输入姓名；<br>老师请输入 <b>teacher</b></p>
    <input type="text" id="loginInput" placeholder="例如：张三 或 teacher" autocomplete="off">
    <button onclick="doLogin()">进入系统</button>
  </div>
</div>

<!-- ================= 2. 学生视图 ================= -->
<div id="view-student">
  <header class="topbar">
    <h1>📐 函数章节 · 学习助手</h1>
    <span class="sub" id="stuInfo"></span>
    <span class="spacer"></span>
    <span class="conn-badge">🟢 本地模式</span>
    <span class="logout-btn" onclick="logout()">退出登录</span>
  </header>
  <div class="layout">
    <main class="chatwrap">
      <div class="chat" id="stuChat"></div>
      <div class="quick" id="stuQuick"></div>
      <div class="mathtools">
        <div class="math-row" id="rowSup"></div>
        <div class="math-row" id="rowSub"></div>
        <div class="math-row" id="rowSym"></div>
        <label class="autoconv">
          <input type="checkbox" id="autoConv" checked>
          快捷输入：自动转换 &nbsp;^a → ᵃ &nbsp;·&nbsp; _a → ₐ
        </label>
      </div>
      <form class="composer" id="stuComposer">
        <textarea id="stuInput" placeholder="用你自己的话讲给我听…（Enter 发送）"></textarea>
        <button type="submit">发送</button>
      </form>
    </main>
    <aside class="panel">
      <h2>📊 进度档案</h2>
      <div id="stuProgList"></div>
      <div class="legend">
        <span class="dot untouched"></span>未讲 <span class="dot ongoing" style="margin-left:10px"></span>讲解中<br>
        <span class="dot cleared"></span>已讲清 <span class="dot stuck" style="margin-left:10px"></span>卡住
      </div>
    </aside>
  </div>
</div>

<!-- ================= 3. 教师视图 ================= -->
<div id="view-teacher">
  <header class="topbar">
    <h1>👩‍🏫 教师端控制台</h1>
    <span class="spacer"></span>
    <span class="conn-badge">🟢 本地同步中</span>
    <span class="logout-btn" onclick="logout()">退出登录</span>
  </header>
  <div class="layout">
    <!-- 左侧任务配置 -->
    <aside class="panel">
      <h2>⚙️ 任务配置</h2>
      
      <div class="field">
        <label>选择监控学生</label>
        <select id="monitorStudent" onchange="switchMonitorStudent()">
          <option value="">-- 暂无在线学生 --</option>
        </select>
      </div>

      <div class="field">
        <label>本次讲解知识点</label>
        <select id="tKpSelect" onchange="updateConfig()"></select>
      </div>

      <div class="field">
        <label>同一焦点追问上限</label>
        <input type="number" id="tFollowUp" min="1" max="10" value="2" onchange="updateConfig()">
      </div>

      <div class="field">
        <label>指定材料</label>
        <input type="text" id="tMaterial" value="教材《数学必修 第一册》第4章与第5章" onchange="updateConfig()">
      </div>

      <div class="field">
        <label>独立检测</label>
        <div class="btn-row">
          <button class="btn primary" onclick="setDetectMode(true)">开启</button>
          <button class="btn" onclick="setDetectMode(false)">结束</button>
        </div>
      </div>

      <hr style="border:none; border-top:1px solid #eef2f7; margin:20px 0;">

      <div class="field">
        <label>学生当前状态</label>
        <div class="state-box" id="tStateBox">
          <div><b>当前知识点</b>：未获取</div>
          <div><b>阶段</b>：未获取</div>
        </div>
      </div>

      <div class="btn-row" style="margin-top:20px;">
        <button class="btn warn" onclick="clearChat()">清空对话</button>
        <button class="btn warn" onclick="resetProgress()">重置进度</button>
      </div>
    </aside>

    <!-- 中间对话监控 -->
    <main class="chatwrap">
      <div class="chat" id="tChat">
        <div style="text-align:center; color:#94a3b8; margin-top:60px;">请从左上角选择一名学生查看</div>
      </div>
      <div class="teacher-send">
        <textarea id="tInput" placeholder="以老师身份发送消息... (Enter 发送)"></textarea>
        <button onclick="sendTeacherMsg()">发送</button>
      </div>
    </main>

    <!-- 右侧进度档案 -->
    <aside class="panel">
      <h2>📊 进度档案</h2>
      <div id="tProgList"></div>
      <div class="legend">
        <span class="dot untouched"></span>未讲 <span class="dot ongoing" style="margin-left:10px"></span>讲解中<br>
        <span class="dot cleared"></span>已讲清 <span class="dot stuck" style="margin-left:10px"></span>卡住
      </div>
    </aside>
  </div>
</div>

<script>
/* ==================================================================
   数据与常量
   ================================================================== */
const LS_CHAT = 'func_chat_log';
const LS_PROGRESS = 'func_progress';
const LS_STATE = 'func_student_state';
const LS_CONFIG = 'func_teacher_config';

const MATH_ROWS = [
  { id: 'rowSup', label: '上标', items: ['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹','ᵃ','ᵇ','ᶜ','ᵈ','ᵉ','ᶠ','ᵍ','ʰ','ⁱ','ʲ','ᵏ','ˡ','ᵐ','ⁿ','ᵒ','ᵖ','ʳ','ˢ','ᵗ','ᵘ','ᵛ','ʷ','ˣ','ʸ','ᶻ','⁺','⁻','⁼','⁽','⁾'] },
  { id: 'rowSub', label: '下标', items: ['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉','ₐ','ₑ','ₕ','ᵢ','ⱼ','ₖ','ₗ','ₘ','ₙ','ₒ','ₚ','ᵣ','ₛ','ₜ','ᵤ','ᵥ','ₓ','₊','₋','₌','₍','₎'] },
  { id: 'rowSym', label: '符号', items: ['√','≠','≤','≥','∈','∉','∞','→','⇒','⇔','·','±','π','Δ','∣','∘','ln','lg','log','⁻¹','x','y','a','b'] }
];
const SUP_MAP = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','=':'⁼','(':'⁽',')':'⁾','a':'ᵃ','b':'ᵇ','c':'ᶜ','d':'ᵈ','e':'ᵉ','f':'ᶠ','g':'ᵍ','h':'ʰ','i':'ⁱ','j':'ʲ','k':'ᵏ','l':'ˡ','m':'ᵐ','n':'ⁿ','o':'ᵒ','p':'ᵖ','r':'ʳ','s':'ˢ','t':'ᵗ','u':'ᵘ','v':'ᵛ','w':'ʷ','x':'ˣ','y':'ʸ','z':'ᶻ' };
const SUB_MAP = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋','=':'₌','(':'₍',')':'₎','a':'ₐ','e':'ₑ','h':'ₕ','i':'ᵢ','j':'ⱼ','k':'ₖ','l':'ₗ','m':'ₘ','n':'ₙ','o':'ₒ','p':'ₚ','r':'ᵣ','s':'ₛ','t':'ₜ','u':'ᵤ','v':'ᵥ','x':'ₓ' };

const KNOWLEDGE = [
  { id:1, name:'幂函数的定义与图像', page:'P80', probes:[{ q:'那 α 取不同值的时候，图像在第一象限里的样子有什么区别呀？', tags:['α','指数','不同','取值','图像','形状','第一象限'] },{ q:'对了，为什么这些图像不管 α 是多少，都会过 (1,1) 这个点？', tags:['(1,1)','过点','定点','都过'] }], exercises: [
    { q:'下面哪些是幂函数：y = x³，y = 2ˣ，y = x⁻¹，y = x² + 1？', attempt:'按你讲的，幂函数得长成 y = xᵅ 的样子。那 y = x³ 和 y = x⁻¹ 是；y = 2ˣ 底数是常数、指数是 x，应该归到另一个家族；y = x² + 1 后面多了个 +1，不符合形式。我这么分对吗？', isTrap:false },
    { q:'如果幂函数 f(x) = x^α 的图像过点 (2, 1/4)，那 α 是多少？', attempt:'既然过 (2, 1/4)，代入进去就是 2^α = 1/4。因为 1/4 是 2 的负二次方，所以 α = -2。我算得对吗？', isTrap:false }
  ]},
  { id:2, name:'幂函数的性质', page:'P83', probes:[{ q:'那奇偶性这边呢？跟 α 有关系吗？', tags:['奇偶','对称','奇函数','偶函数'] },{ q:'在第一象限里，是不是 α 越大的图像越"陡"？', tags:['陡','趋势','增长','大小','快慢'] }], exercises: [
    { q:'比较 1.1^½ 和 1.2^½ 的大小。', attempt:'底数不一样、指数都是 ½，那我应该把它们看成同一个函数 y = x^½ 在两个点上的值。它在 [0, +∞) 递增，1.1 < 1.2，所以 1.1^½ < 1.2^½。这样对吗？', isTrap:false },
    { q:'幂函数 f(x) = x^α 在 (0, +∞) 上是减函数，且图像关于 y 轴对称，那 α 可能是多少？', attempt:'在 (0, +∞) 递减，说明 α < 0。关于 y 轴对称说明是偶函数，所以 α 是负偶数，比如 -2。这样想对吗？', isTrap:false }
  ]},
  { id:3, name:'指数函数的定义与图像', page:'P86', probes:[{ q:'那为什么要规定 a > 0 而且 a ≠ 1？能不能想个反例说明一下？', tags:['a>0','a≠1','限制','规定','为什么','底数'] },{ q:'那它的图像是不是一定过某个定点？是哪个？', tags:['过点','定点','(0,1)','图像'] }], exercises: [
    { q:'y = 3·2ˣ 是指数函数吗？', attempt:'指数函数要能写成 y = aˣ 的样子，a > 0 且 a ≠ 1，而且前面的系数得是 1。3·2ˣ 前面挂着个 3，所以我觉得不是？', isTrap:false },
    { q:'若函数 f(x) = (a² - 3a + 3) · aˣ 是指数函数，求 a 的值。', attempt:'指数函数的要求是系数为 1，底数 a > 0 且 a ≠ 1。所以先让 a² - 3a + 3 = 1，解得 a = 1 或 2。又因为 a ≠ 1，所以 a = 2。我这么想对吗？', isTrap:false }
  ]},
  { id:4, name:'指数函数的性质', page:'P87', probes:[{ q:'那比较两个指数式大小的时候，什么情况下必须分底数讨论？', tags:['比较','大小','底数','讨论','分类'] },{ q:'那它的值域为什么是 (0, +∞)？', tags:['值域','(0,+∞)','正','范围'] }], exercises: [
    { q:'比较 2^0.3 和 2^0.5 的大小。', attempt:'底数 2 > 1，所以 y = 2ˣ 在 R 上是增函数。因为 0.3 < 0.5，所以 2^0.3 < 2^0.5。对吗？', isTrap:false },
    { q:'解不等式：2^(x² - 1) < 4。', attempt:'4 可以写成 2²。因为底数 2 > 1，函数递增，所以直接比较指数：x² - 1 < 2。也就是 x² < 3，所以 -√3 < x < √3。我这么解对吗？', isTrap:false }
  ]},
  { id:5, name:'对数函数的定义与图像', page:'P93', probes:[{ q:'那它和指数函数到底是什么关系？能不能一句话说清楚？', tags:['指数','关系','反','逆','互换'] },{ q:'那它的图像过哪个定点？为什么？', tags:['定点','过点','(1,0)','图像'] }], exercises: [
    { q:'求 y = log₂(x − 1) 的定义域。', attempt:'真数要大于 0，所以 x − 1 > 0，解得 x > 1，定义域是 (1, +∞)。这样对吗？', isTrap:false },
    { q:'函数 y = log_a(x - 2) + 3 的图像必定经过哪个定点？', attempt:'对数函数过定点要求真数为 1。所以令 x - 2 = 1，即 x = 3。此时 y = log_a(1) + 3 = 3。所以定点是 (3, 3)。对吗？', isTrap:false }
  ]},

/* ==================================================================
   全局状态
   ================================================================== */
let currentRole = null; // 'student' | 'teacher'
let studentId = '';     // 当前学生姓名
let monitorStudentId = ''; // 老师当前监控的学生

// 学生端状态
let currentIdx = 8, phase = 'explain', awaitingFirst = true;
let exerciseIndex = 0; 
let asked = new Set(), detectMode = false;
let progressStatus = {}, myChatLog = [];
let isWaitingCorrection = false, currentExerciseDone = false;

// DOM 元素
const el = id => document.getElementById(id);

/* ==================================================================
   工具函数
   ================================================================== */
function loadLS(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e) { return def; } }
function saveLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }
function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
const short = (t, n = 50) => (t.length > n ? t.slice(0, n) + '...' : t);

/* ==================================================================
   登录与视图切换
   ================================================================== */
function doLogin() {
  const val = el('loginInput').value.trim();
  if (!val) return alert('请输入姓名或账号');
  
  if (val.toLowerCase() === 'teacher') {
    currentRole = 'teacher';
    el('view-login').style.display = 'none';
    el('view-teacher').style.display = 'flex';
    initTeacherView();
  } else {
    currentRole = 'student';
    studentId = val;
    el('view-login').style.display = 'none';
    el('view-student').style.display = 'flex';
    el('stuInfo').textContent = `学生：${studentId}`;
    initStudentView();
  }
  el('loginInput').value = '';
}

function logout() {
  if (!confirm('确定要退出当前账号吗？')) return;
  currentRole = null;
  studentId = '';
  monitorStudentId = '';
  el('view-student').style.display = 'none';
  el('view-teacher').style.display = 'none';
  el('view-login').style.display = 'flex';
  
  // 清理全局监听
  window.onstorage = null;
  clearInterval(window.syncTimer);
}

// 支持回车登录
el('loginInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });


/* ==================================================================
   学生端逻辑
   ================================================================== */
function initStudentView() {
  buildMathTools();
  setupAutoConv();

  currentIdx = loadLS(`${LS_STATE}_${studentId}`, { currentIdx: 8 }).currentIdx ?? 8;
  myChatLog = loadLS(`${LS_CHAT}_${studentId}`, []);
  progressStatus = loadLS(`${LS_PROGRESS}_${studentId}`, {});
  
  if (myChatLog.length === 0) addMsgToLocal('ai', buildOpening());
  else { renderChat(); renderProgress(); }

  window.onstorage = (e) => {
    if (e.key === LS_CONFIG) applyTeacherConfig(JSON.parse(e.newValue || '{}'));
  };
}

function buildOpening() { return `嗨，我是你的学习助手。\n\n准备好就开讲吧～不知道从哪开始的话，就从「${KNOWLEDGE[currentIdx].name}」说起？`; }

function buildMathTools() {
  MATH_ROWS.forEach(row => {
    const box = el(row.id);
    if (!box) return;
    box.innerHTML = `<span class="math-label">${row.label}</span>`;
    row.items.forEach(sym => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'math-btn'; b.textContent = sym;
      b.onmousedown = (e) => e.preventDefault();
      b.onclick = () => insertAtCursor(sym);
      box.appendChild(b);
    });
  });
}
function insertAtCursor(text) {
  const input = el('stuInput');
  const s = input.selectionStart, e = input.selectionEnd, v = input.value;
  input.value = v.slice(0, s) + text + v.slice(e);
  const p = s + text.length;
  input.selectionStart = input.selectionEnd = p;
  input.focus();
}
function setupAutoConv() {
  const autoConvEl = el('autoConv');
  const input = el('stuInput');
  let converting = false;
  input.addEventListener('input', () => {
    if (!autoConvEl.checked || converting) return;
    converting = true;
    try {
      const v = input.value, pos = input.selectionStart;
      if (pos >= 2) {
        const prev = v[pos - 2], cur = v[pos - 1];
        let map = null;
        if (prev === '^') map = SUP_MAP;
        else if (prev === '_') map = SUB_MAP;
        if (map && map[cur]) {
          input.value = v.slice(0, pos - 2) + map[cur] + v.slice(pos);
          input.selectionStart = input.selectionEnd = pos - 1;
        }
      }
    } finally { converting = false; }
  });
}

function submitText(txt) {
  if (!txt.trim()) return;
  addMsgToLocal('student', txt);
  el('stuInput').value = '';
  setTimeout(() => respond(txt), 450);
}

function respond(t) {
  if (detectMode) {
    if (/结束检测/.test(t)) { detectMode = false; addMsgToLocal('ai', '独立检测结束。'); return; }
    addMsgToLocal('ai', '（独立检测中，不做提示。）'); return;
  }

  if (phase === 'apply') { handleApplyResponse(t); return; }
  
  if (awaitingFirst) {
    awaitingFirst = false;
    progressStatus[KNOWLEDGE[currentIdx].id] = { status: 'ongoing' };
    saveProgress(); renderProgress();
    addMsgToLocal('ai', `那……你先说说看？关于「${KNOWLEDGE[currentIdx].name}」，你觉得核心是什么？`);
    return;
  }

  const probe = pickProbe(t);
  if (!probe) { startExercise(); return; }

  let intro = t.length < 10 ? getRandom(['嗯嗯，接着说？', '噢噢，明白了，']) : getRandom(['我理一下，', '也就是说，']);
  addMsgToLocal('ai', `${intro}你是说「${short(t)}」。\n\n${probe.q}`);
}

function pickProbe(text) {
  const remaining = KNOWLEDGE[currentIdx].probes.map((p, i) => ({ p, i })).filter(x => !asked.has(x.i));
  if (!remaining.length) return null;
  const hit = remaining.find(x => x.p.tags && x.p.tags.some(tag => text.includes(tag)));
  const chosen = hit || remaining[0];
  asked.add(chosen.i); return chosen.p;
}

function startExercise() {
  phase = 'apply';
  exerciseIndex = 0;
  isWaitingCorrection = false;
  currentExerciseDone = false;
  const ex = KNOWLEDGE[currentIdx].exercises[0];
  addMsgToLocal('ai', `那我按你教的做一道基础题试试：\n\n📝 ${ex.q}\n\n我的想法是：${ex.attempt}`);
}

function handleApplyResponse(t) {
  const kp = KNOWLEDGE[currentIdx];
  const currentEx = kp.exercises[exerciseIndex];
  
  if (currentExerciseDone) return; 

  const isYes = /^(对|是的|正确|没错|完全正确|厉害|棒|算对|没问题)/.test(t.replace(/[\s，。！!～~、,.]/g, ''));
  const isNo = /(不对|错了|有误|有问题|漏了|应该是|还要|检验|不符)/.test(t);
  
  if (isWaitingCorrection) {
    if (t.length > 5 || isYes) {
      isWaitingCorrection = false; currentExerciseDone = true;
      addMsgToLocal('ai', `原来如此！我完全明白了，太感谢你了，这下彻底理顺了！`);
      setTimeout(nextExercise, 1000);
    } else {
      addMsgToLocal('ai', `我还是没太懂你的意思，你能具体说说怎么改吗？`);
    }
    return;
  }

  if (isNo) {
    if (!currentEx.isTrap) {
      addMsgToLocal('ai', `哎？我重新检查了一遍，觉得我这步好像没问题啊。\n\n是不是你哪里看漏了？能具体说说哪一步推导不对吗？`);
      return;
    }
    const isKeyMatched = currentEx.errorKeyword && t.includes(currentEx.errorKeyword);
    if (isKeyMatched || t.length > 8) {
      isWaitingCorrection = true;
      addMsgToLocal('ai', `啊！果然有坑！被你抓住了 😭\n\n你说得对，这里确实要注意。那我按正确的思路重新写一遍：\n\n✅ **修正后的做法**：${currentEx.correctAttempt}\n\n这回我思路对了吧？`);
    } else {
      addMsgToLocal('ai', `不对吗？但我感觉我算得挺顺的呀……🤔\n\n你能具体给我指一下是哪个条件没考虑吗？`);
    }
    return;
  }

  if (isYes) {
    if (currentEx.isTrap) {
      addMsgToLocal('ai', `真的对吗？我写完感觉有点心虚……要不你再帮我检查一下？这题是不是漏了什么前提？`);
      return;
    } else {
      currentExerciseDone = true;
      addMsgToLocal('ai', `太棒了，这题顺利通过！🎉`);
      setTimeout(nextExercise, 1000);
      return;
    }
  }
  addMsgToLocal('ai', `嗯嗯，那你觉得这题我算得对吗？如果有问题直接指出来就行。`);
}

function nextExercise() {
  const kp = KNOWLEDGE[currentIdx];
  if (exerciseIndex < kp.exercises.length - 1) {
    exerciseIndex++;
    currentExerciseDone = false;
    const nextEx = kp.exercises[exerciseIndex];
    const tip = nextEx.isTrap ? '这题稍微有点绕，你得盯着我点。' : '我们再来一道变式。';
    addMsgToLocal('ai', `${tip}\n\n📝 ${nextEx.q}\n\n我的尝试：${nextEx.attempt}`);
  } else {
    progressStatus[kp.id] = { status: 'cleared' };
    saveProgress(); renderProgress();
    phase = 'explain';
    addMsgToLocal('ai', `哇，在你的指导下，这些坑我全避开了！那「${kp.name}」这个点我算是真学透了 🎉\n\n接下来你想讲哪个？`);
  }
}

function addMsgToLocal(role, text, opts = {}) {
  const msg = { id: Date.now() + Math.random(), role, text, ...opts, ts: Date.now() };
  myChatLog.push(msg);
  appendBubble(el('stuChat'), msg); 
  saveChat();
}
function saveChat() { saveLS(`${LS_CHAT}_${studentId}`, myChatLog); saveLS(LS_CHAT, myChatLog); }
function saveProgress() { 
  saveLS(`${LS_PROGRESS}_${studentId}`, progressStatus); saveLS(LS_PROGRESS, progressStatus);
  saveLS(`${LS_STATE}_${studentId}`, { currentIdx, phase });
  saveLS(LS_STATE, { currentIdx, phase });
}
function renderChat() {
  const box = el('stuChat'); box.innerHTML = '';
  myChatLog.forEach(msg => appendBubble(box, msg));
  box.scrollTop = box.scrollHeight;
}
function renderProgress() {
  const box = el('stuProgList'); box.innerHTML = '';
  KNOWLEDGE.forEach(k => {
    const st = (progressStatus[k.id] && progressStatus[k.id].status) || 'untouched';
    const item = document.createElement('div');
    item.className = 'prog-item';
    item.innerHTML = `<span class="dot ${st}"></span> <span>${k.id} ${k.name}</span>`;
    box.appendChild(item);
  });
}

function applyTeacherConfig(cfg) {
  if (!cfg) return;
  if (cfg.clearSignal) {
    myChatLog = []; saveChat();
    addMsgToLocal('ai', buildOpening());
  }
  if (cfg.kpIndex !== undefined && cfg.kpIndex !== currentIdx) {
    currentIdx = cfg.kpIndex; phase = 'explain'; asked = new Set(); exerciseIndex = 0;
    awaitingFirst = false; isWaitingCorrection = false; currentExerciseDone = false;
    progressStatus[KNOWLEDGE[currentIdx].id] = { status: 'ongoing' };
    saveProgress(); renderProgress();
    addMsgToLocal('ai', `（老师端切换了知识点）\n\n好，那我们讲「${KNOWLEDGE[currentIdx].name}」。你先说说看？`);
  }
  if (cfg.detectMode !== undefined) detectMode = cfg.detectMode;
}

// 统一的气泡渲染
function appendBubble(container, msg) {
  const div = document.createElement('div');
  let cls = 'msg ' + (msg.role === 'student' ? 'student' : 'ai');
  if (msg.fromTeacher) cls += ' teacher';
  div.className = cls;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = msg.role === 'student' ? '🧑‍🏫' : (msg.fromTeacher ? '👩‍🏫' : '🐣');
  const bubble = document.createElement('div');
  bubble.className = 'bubble'; bubble.textContent = msg.text;
  div.appendChild(avatar); div.appendChild(bubble);
  container.appendChild(div);
}

// 绑定学生发送事件
el('stuComposer').addEventListener('submit', e => { e.preventDefault(); submitText(el('stuInput').value.trim()); });
el('stuInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitText(el('stuInput').value.trim()); }
});


/* ==================================================================
   教师端逻辑
   ================================================================== */
function initTeacherView() {
  // 填充知识点下拉框
  const sel = el('tKpSelect');
  sel.innerHTML = '';
  KNOWLEDGE.forEach((k, i) => {
    const o = document.createElement('option');
    o.value = String(i); o.textContent = `知识点${k.id} ${k.name}`; sel.appendChild(o);
  });

  // 扫描当前已注册的学生
  scanStudents();
  
  // 定时轮询，保证跨标签页数据同步（也可以靠 storage 事件，这里用定时器兜底）
  clearInterval(window.teacherTimer);
  window.teacherTimer = setInterval(() => {
    scanStudents();
    if (monitorStudentId) refreshTeacherData();
  }, 1000);

  window.onstorage = (e) => {
    if (e.key.includes('func_')) {
      scanStudents();
      if (monitorStudentId) refreshTeacherData();
    }
  };
}

function scanStudents() {
  let students = new Set();
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith(`${LS_CHAT}_`)) {
      const name = key.replace(`${LS_CHAT}_`, '');
      if (name && name !== 'undefined') students.add(name);
    }
  }
  
  const sel = el('monitorStudent');
  const currentVal = sel.value;
  
  // 清空重填（保留选中状态）
  sel.innerHTML = '<option value="">-- 请选择学生 --</option>';
  students.forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name;
    sel.appendChild(o);
  });

  if (students.has(currentVal)) sel.value = currentVal;
  else if (!monitorStudentId && students.size > 0) {
    // 默认选第一个
    monitorStudentId = Array.from(students)[0];
    sel.value = monitorStudentId;
    refreshTeacherData();
  }
}

function switchMonitorStudent() {
  monitorStudentId = el('monitorStudent').value;
  refreshTeacherData();
}

function refreshTeacherData() {
  if (!monitorStudentId) return;
  
  // 1. 加载数据
  const chatLog = loadLS(`${LS_CHAT}_${monitorStudentId}`, []);
  const progress = loadLS(`${LS_PROGRESS}_${monitorStudentId}`, {});
  const state = loadLS(`${LS_STATE}_${monitorStudentId}`, { currentIdx: 8, phase: 'explain' });
  const cfg = loadLS(LS_CONFIG, { detectMode: false, kpIndex: 8, followUpLimit: 2 });
  
  // 2. 渲染对话
  const chatBox = el('tChat');
  chatBox.innerHTML = '';
  if (chatLog.length === 0) {
    chatBox.innerHTML = '<div style="text-align:center; color:#94a3b8; margin-top:60px;">该学生暂无对话记录</div>';
  } else {
    chatLog.forEach(msg => appendBubble(chatBox, msg));
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // 3. 渲染进度
  const progBox = el('tProgList');
  progBox.innerHTML = '';
  KNOWLEDGE.forEach(k => {
    const st = (progress[k.id] && progress[k.id].status) || 'untouched';
    const item = document.createElement('div');
    item.className = 'prog-item';
    item.innerHTML = `<span class="dot ${st}"></span> <span>${k.id} ${k.name}</span>`;
    progBox.appendChild(item);
  });

  // 4. 渲染状态
  const kpName = KNOWLEDGE[state.currentIdx] ? KNOWLEDGE[state.currentIdx].name : '未知';
  const phaseMap = { explain: '讲解中', apply: '应用作答' };
  el('tStateBox').innerHTML = `
    <div><b>当前知识点</b>：${state.currentIdx} ${kpName}</div>
    <div><b>阶段</b>：${phaseMap[state.phase] || state.phase || '未开始'}</div>
    <div><b>独立检测</b>：${cfg.detectMode ? '开启' : '关闭'}</div>
  `;

  // 5. 同步配置到面板
  if (!document.activeElement || !['tKpSelect','tFollowUp','tMaterial'].includes(document.activeElement.id)) {
    el('tKpSelect').value = String(cfg.kpIndex ?? 8);
    el('tFollowUp').value = cfg.followUpLimit || 2;
    el('tMaterial').value = cfg.material || '教材《数学必修 第一册》第4章与第5章';
  }
}

function updateConfig() {
  if (!monitorStudentId) return alert('请先选择学生');
  const cfg = loadLS(LS_CONFIG, {});
  const newCfg = {
    ...cfg,
    kpIndex: Number(el('tKpSelect').value),
    followUpLimit: Number(el('tFollowUp').value) || 2,
    material: el('tMaterial').value,
    clearSignal: cfg.clearSignal || 0,
    resetProgressSignal: cfg.resetProgressSignal || 0
  };
  saveLS(LS_CONFIG, newCfg);
  // 如果是本地同一个页面，立即触发更新
  if(currentRole === 'student') applyTeacherConfig(newCfg);
}

function setDetectMode(on) {
  if (!monitorStudentId) return alert('请先选择学生');
  const cfg = loadLS(LS_CONFIG, {});
  cfg.detectMode = on;
  saveLS(LS_CONFIG, cfg);
  refreshTeacherData();
}

function clearChat() {
  if (!monitorStudentId) return alert('请先选择学生');
  if (!confirm(`确定清空学生 [${monitorStudentId}] 的对话记录吗？`)) return;
  saveLS(`${LS_CHAT}_${monitorStudentId}`, []);
  const cfg = loadLS(LS_CONFIG, {});
  cfg.clearSignal = (cfg.clearSignal || 0) + 1;
  saveLS(LS_CONFIG, cfg);
  refreshTeacherData();
}

function resetProgress() {
  if (!monitorStudentId) return alert('请先选择学生');
  if (!confirm(`确定重置学生 [${monitorStudentId}] 的所有进度吗？`)) return;
  saveLS(`${LS_PROGRESS}_${monitorStudentId}`, {});
  const cfg = loadLS(LS_CONFIG, {});
  cfg.resetProgressSignal = (cfg.resetProgressSignal || 0) + 1;
  saveLS(LS_CONFIG, cfg);
  refreshTeacherData();
}

function sendTeacherMsg() {
  if (!monitorStudentId) return alert('请先选择学生');
  const input = el('tInput');
  const text = input.value.trim();
  if (!text) return;
  
  const chatLog = loadLS(`${LS_CHAT}_${monitorStudentId}`, []);
  chatLog.push({ id: Date.now() + Math.random(), role: 'ai', fromTeacher: true, text, ts: Date.now() });
  saveLS(`${LS_CHAT}_${monitorStudentId}`, chatLog);
  input.value = '';
  refreshTeacherData();
}

el('tInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTeacherMsg(); }
});

// 启动时自动检查是否有 localStorage 中的登录状态？(为了测试方便，这里不自动登录)
</script>
