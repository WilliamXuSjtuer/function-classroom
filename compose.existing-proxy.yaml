# Run only this file when another service already handles HTTPS on the host.
# docker compose -f compose.existing-proxy.yaml up -d --build
name: function-classroom

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATA_DIR: /app/data
      APP_ORIGIN: ${CLASSROOM_ORIGIN:?Set CLASSROOM_ORIGIN in .env to the public HTTPS URL}
      COOKIE_SECURE: "true"
      DEMO_MODE: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-12}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
    ports:
      - "127.0.0.1:${CLASSROOM_PORT:-1116}:3001"
    volumes:
      - classroom-data:/app/data

volumes:
  classroom-data:
